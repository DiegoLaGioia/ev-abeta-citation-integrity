[project]
name = "ev-abeta-citation-integrity"
version = "0.1.0"
description = "Citation-integrity tool on the EV-Abeta microglial axis: claim-to-source verification on full-text OA papers."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "lxml>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
